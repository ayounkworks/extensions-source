name: Build and Publish Extension Repository

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '.github/scripts/**'
      - '.github/workflows/build_push.yml'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'core/**'
      - 'lib/**'
      - 'lib-multisrc/**'
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: Rebuild and republish every extension
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: extension-repository-publish
  cancel-in-progress: true

env:
  CI_CHUNK_SIZE: 80
  IS_PR_CHECK: false
  PYTHONUNBUFFERED: '1'

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.generate-matrices.outputs.matrix }}
      delete: ${{ steps.generate-matrices.outputs.delete }}
      full_rebuild: ${{ steps.base.outputs.full_rebuild || steps.generate-matrices.outputs.full_rebuild }}
      signing_configured: ${{ steps.signing-config.outputs.configured }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: signing-config
        name: Detect repository signing configuration
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$SIGNING_KEY" ] && [ -n "$ALIAS" ] && [ -n "$KEY_STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$SIGNING_KEY" ] && [ -z "$ALIAS" ] && [ -z "$KEY_STORE_PASSWORD" ] && [ -z "$KEY_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No repository keystore configured; this run is build-verification only."
          else
            echo "Signing secrets are partially configured. Set all four or clear all four."
            exit 1
          fi

      - id: base
        name: Find last successful build
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_REBUILD: ${{ inputs.full_rebuild }}
        run: |
          empty_tree=$(git hash-object -t tree /dev/null)
          if [ "$FULL_REBUILD" = "true" ]; then
            sha=$empty_tree
            echo "full_rebuild=true" >> "$GITHUB_OUTPUT"
          else
            sha=$(python ./.github/scripts/find-base-sha.py build_push.yml)
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - id: generate-matrices
        name: Generate build matrix
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: python ./.github/scripts/generate-build-matrices.py "$BASE_SHA"

  build-extensions:
    name: Build extensions (${{ matrix.chunk.number }})
    needs: prepare
    if: ${{ toJson(fromJson(needs.prepare.outputs.matrix).chunk) != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          EXPECTED_SIGNING_KEY: 82e886ecd270d012936fa4298ff2d1f46a66d1368f80e12a0b95b99a216c04b7
        run: |
          set -euo pipefail
          if [ -n "$SIGNING_KEY" ]; then
            if [ -z "$KEY_STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
              echo "When SIGNING_KEY is set, ALIAS, KEY_STORE_PASSWORD, and KEY_PASSWORD must also be set."
              exit 1
            fi
            printf '%s' "$SIGNING_KEY" | base64 -d > signingkey.jks
            keytool -list -keystore signingkey.jks -storepass "$KEY_STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            ACTUAL_SIGNING_KEY="$(keytool -exportcert -keystore signingkey.jks -storepass "$KEY_STORE_PASSWORD" -alias "$KEY_ALIAS" | sha256sum | awk '{print $1}')"
            if [ "$ACTUAL_SIGNING_KEY" != "$EXPECTED_SIGNING_KEY" ]; then
              echo "Signing certificate does not match the existing Mihon repository fingerprint."
              echo "Expected: $EXPECTED_SIGNING_KEY"
              echo "Actual:   $ACTUAL_SIGNING_KEY"
              exit 1
            fi
            echo "Using repository keystore signing."
          else
            if [ -n "$KEY_STORE_PASSWORD" ] || [ -n "$KEY_PASSWORD" ] || [ -n "$KEY_ALIAS" ]; then
              echo "Signing secrets are only partially configured."
              exit 1
            fi
            echo "No signing keystore configured. Testing Android debug signing against the existing repository fingerprint."
            rm -f signingkey.jks
          fi
      - name: Build extensions
        env:
          MODULES: ${{ join(matrix.chunk.modules, ' ') }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          TASKS=()
          for module in $MODULES; do
            TASKS+=("${module}:assembleRelease")
          done
          ./gradlew "${TASKS[@]}"
      - name: Validate extension build outputs and APK signatures
        env:
          EXPECTED_SIGNING_KEY: 82e886ecd270d012936fa4298ff2d1f46a66d1368f80e12a0b95b99a216c04b7
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          find . -path '*/build/keiyoushi-source-info.json' -print -quit | grep -q .
          find . -path '*/build/outputs/jar/release/*.jar' -print -quit | grep -q .
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          APK_COUNT=0
          while IFS= read -r -d '' APK; do
            APK_COUNT=$((APK_COUNT + 1))
            if [ -n "$SIGNING_KEY" ]; then
              ACTUAL_SIGNING_KEY="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest/ {print tolower($NF); exit}' | tr -d ':[:space:]')"
              if [ "$ACTUAL_SIGNING_KEY" != "$EXPECTED_SIGNING_KEY" ]; then
                echo "APK signature mismatch: $APK"
                echo "Expected: $EXPECTED_SIGNING_KEY"
                echo "Actual:   $ACTUAL_SIGNING_KEY"
                exit 1
              fi
            fi
          done < <(find . -type f -path '*/build/outputs/apk/release/*.apk' -print0)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "No release APKs were produced."
            exit 1
          fi
          if [ -n "$SIGNING_KEY" ]; then
            echo "Validated $APK_COUNT APK(s) against the repository certificate."
          else
            echo "Validated $APK_COUNT build APK(s). Signature verification and repository publishing are disabled until the keystore is configured."
          fi
      - name: Upload APK artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "individual-apks-${{ matrix.chunk.number }}"
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/jar/release/*.jar
            **/build/keiyoushi-source-info.json
          if-no-files-found: error
          retention-days: 2
      - name: Remove signing material
        if: always()
        run: rm -f signingkey.jks
  publish:
    name: Publish Mihon repository
    needs: [prepare, build-extensions]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.signing_configured == 'true' &&
      needs.build-extensions.result != 'failure' &&
      needs.build-extensions.result != 'cancelled' &&
      (needs.prepare.outputs.delete != '[]' || needs.build-extensions.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Download build artifacts
        if: needs.build-extensions.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ~/apk-artifacts

      - name: Checkout source scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
          persist-credentials: false

      - name: Checkout published repository branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: repo
          path: repo
          token: ${{ github.token }}
          persist-credentials: true

      - name: Publish metadata and assets
        working-directory: repo
        env:
          DELETE: ${{ needs.prepare.outputs.delete }}
          FULL_REBUILD: ${{ needs.prepare.outputs.full_rebuild }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MIHON_REPOSITORY_SIGNING_KEY: 82e886ecd270d012936fa4298ff2d1f46a66d1368f80e12a0b95b99a216c04b7
        run: |
          python -m pip install --disable-pip-version-check protobuf
          python -u ../main/.github/scripts/publish-repo.py "$DELETE" "$GITHUB_SHA" "$FULL_REBUILD"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish extension repository for $GITHUB_SHA"
            git push origin HEAD:repo
          else
            echo "No repository changes to publish."
          fi
