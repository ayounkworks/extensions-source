name: Build and Publish Extension Repository

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '.github/scripts/**'
      - '.github/workflows/build_push.yml'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'core/**'
      - 'lib/**'
      - 'lib-multisrc/**'
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: Rebuild and republish every extension
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: extension-repository-publish
  cancel-in-progress: false

env:
  CI_CHUNK_SIZE: 80
  IS_PR_CHECK: false
  PYTHONUNBUFFERED: '1'

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.generate-matrices.outputs.matrix }}
      delete: ${{ steps.generate-matrices.outputs.delete }}
      full_rebuild: ${{ steps.base.outputs.full_rebuild || steps.generate-matrices.outputs.full_rebuild }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: base
        name: Find last successful build
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_REBUILD: ${{ inputs.full_rebuild }}
        run: |
          empty_tree=$(git hash-object -t tree /dev/null)
          if [ "$FULL_REBUILD" = "true" ]; then
            sha=$empty_tree
            echo "full_rebuild=true" >> "$GITHUB_OUTPUT"
          else
            sha=$(python ./.github/scripts/find-base-sha.py build_push.yml)
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - id: generate-matrices
        name: Generate build matrix
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: python ./.github/scripts/generate-build-matrices.py "$BASE_SHA"

  build-extensions:
    name: Build extensions (${{ matrix.chunk.number }})
    needs: prepare
    if: ${{ toJson(fromJson(needs.prepare.outputs.matrix).chunk) != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ] || [ -z "$KEY_STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "SIGNING_KEY, ALIAS, KEY_STORE_PASSWORD, and KEY_PASSWORD secrets are required."
            exit 1
          fi
          printf '%s' "$SIGNING_KEY" | base64 -d > signingkey.jks
          keytool -list -keystore signingkey.jks -storepass "$KEY_STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Build extensions
        env:
          MODULES: ${{ join(matrix.chunk.modules, ' ') }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          TASKS=()
          for module in $MODULES; do
            TASKS+=("${module}:assembleRelease")
          done
          ./gradlew "${TASKS[@]}"
      - name: Validate extension build outputs
        shell: bash
        run: |
          set -euo pipefail
          find . -path '*/build/keiyoushi-source-info.json' -print -quit | grep -q .
          find . -path '*/build/outputs/apk/release/*.apk' -print -quit | grep -q .
          find . -path '*/build/outputs/jar/release/*.jar' -print -quit | grep -q .
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "individual-apks-${{ matrix.chunk.number }}"
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/jar/release/*.jar
            **/build/keiyoushi-source-info.json
          if-no-files-found: error
          retention-days: 2
      - name: Remove signing material
        if: always()
        run: rm -f signingkey.jks
  publish:
    name: Publish Mihon repository
    needs: [prepare, build-extensions]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.build-extensions.result != 'failure' &&
      needs.build-extensions.result != 'cancelled' &&
      (needs.prepare.outputs.delete != '[]' || needs.build-extensions.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Download build artifacts
        if: needs.build-extensions.result == 'success'
        uses: actions/download-artifact@v4
        with:
          path: ~/apk-artifacts

      - name: Checkout source scripts
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          persist-credentials: false

      - name: Checkout published repository branch
        uses: actions/checkout@v4
        with:
          ref: repo
          path: repo
          token: ${{ github.token }}
          persist-credentials: true

      - name: Publish metadata and assets
        working-directory: repo
        env:
          DELETE: ${{ needs.prepare.outputs.delete }}
          FULL_REBUILD: ${{ needs.prepare.outputs.full_rebuild }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m pip install --disable-pip-version-check protobuf
          python -u ../main/.github/scripts/publish-repo.py "$DELETE" "$GITHUB_SHA" "$FULL_REBUILD"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish extension repository for $GITHUB_SHA"
            git push origin HEAD:repo
          else
            echo "No repository changes to publish."
          fi
