name: Build and Publish VoraToon Personal

on:
  push:
    branches:
      - fix/voratoon-upstream-sync
      - fix/voratoon-personal-rsc-migration
      - fix/voratoon-personal-audit-2026
      - main
    paths:
      - "src/id/voratoon/**"
      - ".github/workflows/build_voratoon_personal.yml"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "core/**"
      - "lib/**"
      - "lib-multisrc/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-voratoon-personal-indexpb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish VoraToon
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Prepare and verify repository signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          EXPECTED_SIGNING_KEY: 7d3915d9b79773a0767d295daed4ee36d62cf425626e8ebeca9fb04f459aef32
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY" || { echo "SIGNING_KEY secret is empty"; exit 1; }
          test -n "$ALIAS" || { echo "ALIAS secret is empty"; exit 1; }
          test -n "$KEY_STORE_PASSWORD" || { echo "KEY_STORE_PASSWORD secret is empty"; exit 1; }
          printf '%s' "$SIGNING_KEY" | base64 --decode > signingkey.jks
          test -s signingkey.jks
          ACTUAL_SIGNING_KEY="$(keytool -exportcert -keystore signingkey.jks -storepass "$KEY_STORE_PASSWORD" -alias "$ALIAS" | sha256sum | awk '{print tolower($1)}')"
          echo "Signing certificate SHA-256: $ACTUAL_SIGNING_KEY"
          if [ "$ACTUAL_SIGNING_KEY" != "$EXPECTED_SIGNING_KEY" ]; then
            echo "Signing certificate does not match the repository fingerprint."
            exit 1
          fi

      - name: Build VoraToon extension
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :src:id:voratoon:assembleRelease :src:id:voratoon:lintRelease

      - name: Upload build artifact as backup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voratoon-personal-extension
          path: |
            src/id/voratoon/build/outputs/apk/release/*.apk
            src/id/voratoon/build/outputs/jar/release/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Generate Mihon index.pb repository
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --upgrade "protobuf==7.35.1"
          python3 -c 'import google.protobuf; assert google.protobuf.__version__ == "7.35.1", google.protobuf.__version__'
          APK="$(find src/id/voratoon/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          JAR="$(find src/id/voratoon/build/outputs/jar/release -maxdepth 1 -type f -name '*.jar' -print -quit)"
          INFO="src/id/voratoon/build/keiyoushi-source-info.json"
          ICON="src/id/voratoon/res/mipmap-xhdpi/ic_launcher.png"
          test -n "$APK"
          test -n "$JAR"
          test -f "$INFO"
          test -f "$ICON"

          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)" || {
            printf '%s\\n' "$VERIFY_OUTPUT"
            echo "VoraToon Personal APK signature verification failed: $APK"
            exit 1
          }
          printf '%s\\n' "$VERIFY_OUTPUT"
          APK_FINGERPRINT="$(printf '%s\\n' "$VERIFY_OUTPUT" | awk -F': ' '/certificate SHA-256 digest/ {print tolower($NF); exit}' | tr -d ':[:space:]')"
          EXPECTED_FINGERPRINT=7d3915d9b79773a0767d295daed4ee36d62cf425626e8ebeca9fb04f459aef32
          test "$APK_FINGERPRINT" = "$EXPECTED_FINGERPRINT"

          FILENAME_APK="$(basename "$APK")"
          FILENAME_JAR="$(basename "$JAR")"
          FINGERPRINT="$APK_FINGERPRINT"

          PUBLISH_DIR="$RUNNER_TEMP/voratoon-repo"
          mkdir -p "$PUBLISH_DIR"
          cp "$APK" "$PUBLISH_DIR/$FILENAME_APK"
          cp "$JAR" "$PUBLISH_DIR/$FILENAME_JAR"
          cp "$ICON" "$PUBLISH_DIR/icon.png"

          python3 - "$PUBLISH_DIR" "$FILENAME_APK" "$FILENAME_JAR" "$FINGERPRINT" "$INFO" "${GITHUB_REPOSITORY}" <<'PY'
          import gzip
          import json
          import pathlib
          import sys

          from google.protobuf import json_format

          root = pathlib.Path(sys.argv[1])
          apk_name, jar_name, fingerprint, info_path, repository = sys.argv[2:]
          sys.path.insert(0, str(pathlib.Path.cwd() / ".github" / "scripts"))
          import index_pb2

          info = json.loads(pathlib.Path(info_path).read_text(encoding="utf-8"))
          raw_base = f"https://raw.githubusercontent.com/{repository}/repo"
          extension = index_pb2.Extension(
              name=info["name"],
              packageName=info["packageName"],
              resources=index_pb2.Resources(
                  apkUrl=f"{raw_base}/{apk_name}",
                  iconUrl=f"{raw_base}/icon.png",
                  jarUrl=f"{raw_base}/{jar_name}",
              ),
              extensionLib=info["extensionLib"],
              versionCode=info["versionCode"],
              versionName=info["versionName"],
              contentWarning=info["contentWarning"],
              sources=[
                  index_pb2.Source(
                      id=int(source["id"]),
                      name=source["name"],
                      language=source["lang"],
                      homeUrl=source["baseUrl"],
                      mirrorUrls=source.get("mirrorUrls", []),
                  )
                  for source in info["sources"]
              ],
          )

          index = index_pb2.Index(
              name="VoraToon Personal",
              badgeLabel="VORA",
              signingKey=fingerprint,
              contact=index_pb2.Contact(
                  website=f"https://github.com/{repository}",
              ),
              extensionList=index_pb2.ExtensionList(extensions=[extension]),
          )
          (root / "index.pb").write_bytes(
              gzip.compress(index.SerializeToString(deterministic=True), mtime=0)
          )
          (root / "index.json").write_text(
              json_format.MessageToJson(
                  index,
                  always_print_fields_with_no_presence=False,
                  preserving_proto_field_name=True,
              ) + "\n",
              encoding="utf-8",
          )
          (root / "repo.json").write_text(
              json.dumps({
                  "index_v2": f"{raw_base}/index.pb",
                  "meta": {
                      "name": "VoraToon Personal",
                      "shortName": "VoraToon",
                      "website": f"https://github.com/{repository}",
                      "signingKeyFingerprint": fingerprint,
                  },
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          (root / "README.md").write_text(
              "# VoraToon Personal\n\n"
              "Add this repository URL in Mihon → Settings → Browse → Extension repos:\n\n"
              f"{raw_base}/index.pb\n",
              encoding="utf-8",
          )
          PY

      - name: Publish repository branch
        if: github.ref == 'refs/heads/fix/voratoon-upstream-sync' || github.ref == 'refs/heads/fix/voratoon-personal-audit-2026' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/voratoon-repo"
          git init --initial-branch=repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish VoraToon Personal extension repository"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin repo

# CI validation trigger: build and lint only; publishing remains restricted to the personal upstream branch.
