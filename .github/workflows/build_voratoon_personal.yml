name: Build VoraToon Personal Extension

on:
  push:
    branches:
      - fix/voratoon-api-response
    paths:
      - "src/id/voratoon/**"
      - ".github/workflows/build_voratoon_personal.yml"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "core/**"
      - "lib/**"
      - "lib-multisrc/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-voratoon-personal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VoraToon extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build VoraToon extension
        run: ./gradlew :src:id:voratoon:assembleRelease

      - name: Upload extension APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voratoon-personal-extension
          path: src/id/voratoon/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
