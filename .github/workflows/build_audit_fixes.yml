name: Build Audit Fixes

on:
  push:
    branches:
      - fix/extension-audit-guards
    paths:
      - "src/en/mangago/**"
      - ".github/workflows/build_audit_fixes.yml"
      - "core/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-audit-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mangago:
    name: Build and lint Mangago
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Audit package names
        run: python ./.github/scripts/audit-packages.py

      - name: Build and lint Mangago
        run: ./gradlew :src:en:mangago:assembleRelease :src:en:mangago:lintRelease --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: mangago-audit-build
          path: |
            src/en/mangago/build/outputs/apk/release/*.apk
            src/en/mangago/build/outputs/jar/release/*.jar
          if-no-files-found: error
          retention-days: 7
